[project]
name = "pitchside"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.0",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pitchside-gen = "pitchside.generator.cli:main"
pitchside-live = "pitchside.live.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchside"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
