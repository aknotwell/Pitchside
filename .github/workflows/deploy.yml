# Every push to main deploys the code to the shared azd environment (matchlens-dev).
# Keyless: GitHub OIDC -> user-assigned managed identity id-github-deploy in rg-matchlens-dev,
# federated on repo:aknotwell/Pitchside:ref:refs/heads/main. The IDs below are not secrets.
#
# Deploy only. Infra changes (infra/**) still need a manual `azd provision` from a machine
# with the full azd env: provisioning from a fresh CI env would reset parameters such as
# WEBPUBSUB_SKU and SERVICE_*_RESOURCE_EXISTS (which puts the apps back on placeholder images).
name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tests/**"
      - ".vscode/**"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-matchlens-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_CLIENT_ID: 95785389-1364-43b0-b9d4-4f2591e76190
      AZURE_TENANT_ID: d4aeae60-a598-460a-b38a-6c6bb8c592ce
      AZURE_SUBSCRIPTION_ID: cbb2ef3b-ed42-4e42-9c51-99e5895ece87
      AZURE_ENV_NAME: matchlens-dev
      AZURE_LOCATION: eastus2
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: azd login (federated)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - name: Load the azd environment from the resource group
        # Every name derives from the resource token in main.bicep, so read it off the registry
        # (crTOKEN) instead of the subscription-scope deployment the RG-scoped identity can't see.
        run: |
          RG=rg-matchlens-dev
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          [ -n "$ACR" ] || { echo "::error::no container registry in $RG"; exit 1; }
          T=${ACR#cr}
          API_FQDN=$(az resource show -g "$RG" -n "ca-api-$T" --resource-type Microsoft.App/containerApps \
            --query properties.configuration.ingress.fqdn -o tsv)
          azd env set AZURE_RESOURCE_GROUP "$RG"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR.azurecr.io"
          azd env set AZURE_CONTAINER_ENVIRONMENT_NAME "cae-$T"
          azd env set API_URL "https://$API_FQDN"
          azd env set INTERPRETER_APP_NAME "ca-interp-$T"
          azd env set SIM_JOB_NAME "job-sim-$T"
          azd env set REPLAY_JOB_NAME "job-replay-$T"
          azd env set FUNCTIONS_APP_NAME "func-cues-$T"
          azd env set KEYVAULT_NAME "kv-$T"
          az config set extension.use_dynamic_install=yes_without_prompt
      - run: azd deploy --all --no-prompt
      - name: Smoke test
        run: |
          API_URL=$(azd env get-value API_URL)
          for i in 1 2 3 4 5 6; do curl -fsS "$API_URL/api/health" && exit 0; sleep 20; done
          exit 1
