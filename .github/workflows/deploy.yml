# Every push to main deploys the code to the shared azd environment (matchlens-dev).
# Keyless: GitHub OIDC -> user-assigned managed identity id-github-deploy in rg-matchlens-dev,
# federated on repo:aknotwell/Pitchside:ref:refs/heads/main. The IDs below are not secrets.
#
# The identity is Owner on the subscription so it can also run `azd provision`, which happens
# when a push changes infra/ or azure.yaml (or on a manual run with "provision" ticked).
# The CI azd env starts empty, so the Bicep parameters of the live environment are pinned
# below; change them here, not with `azd env set` on a laptop.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tests/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      provision:
        description: Run azd provision before deploying
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-matchlens-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_CLIENT_ID: 95785389-1364-43b0-b9d4-4f2591e76190
      AZURE_TENANT_ID: d4aeae60-a598-460a-b38a-6c6bb8c592ce
      AZURE_SUBSCRIPTION_ID: cbb2ef3b-ed42-4e42-9c51-99e5895ece87
      AZURE_ENV_NAME: matchlens-dev
      AZURE_LOCATION: eastus2
      # Bicep parameters (infra/main.parameters.json) of the live environment.
      AZURE_PRINCIPAL_ID: bb4de62a-18ef-406b-8830-1a6cf085a81c  # vmoose@outlook.com keeps data access
      AZURE_PRINCIPAL_TYPE: User
      WEBPUBSUB_SKU: Standard_S1
      ALERT_EMAIL: vmoose@outlook.com
      DEMO_MODE: "false"
      SERVICE_API_RESOURCE_EXISTS: "true"  # keep the deployed images instead of the placeholder
      SERVICE_INTERPRETER_RESOURCE_EXISTS: "true"
      SERVICE_STORYTELLER_RESOURCE_EXISTS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the infrastructure change?
        id: infra
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.provision }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            CHANGED=$FORCE
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || git diff --name-only "$BEFORE" HEAD -- infra azure.yaml | grep -q .; then
            CHANGED=true
          fi
          echo "provision=${CHANGED:-false}" >> "$GITHUB_OUTPUT"
      - uses: Azure/setup-azd@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: azd login (federated)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - name: Load the azd environment from the resource group
        # Every name derives from the resource token in main.bicep, so read it off the registry
        # (crTOKEN). A provision below overwrites these with its outputs.
        run: |
          RG=rg-matchlens-dev
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          for v in AZURE_PRINCIPAL_ID AZURE_PRINCIPAL_TYPE WEBPUBSUB_SKU ALERT_EMAIL DEMO_MODE \
                   SERVICE_API_RESOURCE_EXISTS SERVICE_INTERPRETER_RESOURCE_EXISTS SERVICE_STORYTELLER_RESOURCE_EXISTS; do
            azd env set "$v" "$(printenv "$v")"
          done
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          [ -n "$ACR" ] || { echo "::error::no container registry in $RG"; exit 1; }
          T=${ACR#cr}
          API_FQDN=$(az resource show -g "$RG" -n "ca-api-$T" --resource-type Microsoft.App/containerApps \
            --query properties.configuration.ingress.fqdn -o tsv)
          azd env set AZURE_RESOURCE_GROUP "$RG"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR.azurecr.io"
          azd env set AZURE_CONTAINER_ENVIRONMENT_NAME "cae-$T"
          azd env set API_URL "https://$API_FQDN"
          azd env set INTERPRETER_APP_NAME "ca-interp-$T"
          azd env set SIM_JOB_NAME "job-sim-$T"
          azd env set REPLAY_JOB_NAME "job-replay-$T"
          azd env set FUNCTIONS_APP_NAME "func-cues-$T"
          azd env set KEYVAULT_NAME "kv-$T"
          az config set extension.use_dynamic_install=yes_without_prompt
      - if: steps.infra.outputs.provision == 'true'
        run: azd provision --no-prompt
      - run: azd deploy --all --no-prompt
      - name: Smoke test
        run: |
          API_URL=$(azd env get-value API_URL)
          for i in 1 2 3 4 5 6; do curl -fsS "$API_URL/api/health" && exit 0; sleep 20; done
          exit 1
