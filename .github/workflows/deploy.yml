# Keyless deploy with azd. Configure once with `azd pipeline config` (creates the federated
# credential and the AZURE_* repository variables). No secrets are stored.
name: deploy
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: azd login (federated)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - run: azd provision --no-prompt
      - run: azd deploy --no-prompt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Evaluation gate (Foundry evaluators + code verifier)
        run: uv sync --frozen && uv run python scripts/evaluate.py --seeds 501 502 --max-moments 8
      - name: Smoke test
        run: |
          API_URL=$(azd env get-value API_URL)
          curl -fsS "$API_URL/api/health"
