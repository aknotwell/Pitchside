name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q --junitxml=pytest-report.xml
      # Show the test counts on the run's summary page, so a PR shows what actually ran.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: uv run python scripts/test_summary.py pytest-report.xml >> "$GITHUB_STEP_SUMMARY"
