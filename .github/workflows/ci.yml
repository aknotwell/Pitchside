name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:  # Python services, engine and tests (the required check on main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build (lint + type check)
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t matchlens:ci .
      - name: Smoke-test every entrypoint imports
        run: docker run --rm --entrypoint python matchlens:ci -c "import matchlens.services.api, matchlens.services.interpreter, matchlens.services.storyteller, matchlens.services.simulator"
