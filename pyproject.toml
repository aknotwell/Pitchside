[project]
name = "matchlens"
version = "0.1.0"
description = "Live explain layer for synthetic football: simulator, interpreter, storyteller and API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.14,<3",
  "numpy>=2.5,<3",
  "azure-identity>=1.26,<2",
  "azure-eventhub>=5.15,<6",
  "azure-eventhub-checkpointstoreblob-aio>=1.2,<2",
  "azure-servicebus>=7.15,<8",
  "azure-cosmos>=4.17,<5",
  "azure-messaging-webpubsubservice>=1.3,<2",
  "azure-monitor-opentelemetry>=1.8,<2",
  "aiohttp>=3.12",
  "openai>=3.26,<4",
  "agent-framework-core==1.21.0",
  "agent-framework-foundry==1.14.1",
  "agent-framework-azure-cosmos==1.0.0b261002",
  "mcp>=1.24,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "azure-eventgrid>=4.22,<5",
  "azure-storage-queue>=12.13,<13",
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "azure-ai-evaluation>=1.18",
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
